              slos:
                description: Service Level Objective definitions.
                items:
                  properties:
                    description:
                      description: Description of what this SLO measures.
                      type: string
                    displayName:
                      description: Human-readable display name.
                      type: string
                    isBiggerBetter:
                      default: false
                      description: Whether higher values are better for this metric.
                      type: boolean
                    name:
                      description: Unique name for this SLO.
                      type: string
                    query:
                      description: PromQL query returning a single numeric SLI value.
                      type: string
                    threshold:
                      description: Threshold value for the SLO.
                      type: number
                    thresholdDirection:
                      default: LessThanOrEqual
