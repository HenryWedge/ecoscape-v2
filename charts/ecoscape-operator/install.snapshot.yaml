---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ecoscape-metrics-auth-role
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ecoscape-metrics-reader
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ecoscape
  name: ecoscape-leader-election-rolebinding
  namespace: ecoscape-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecoscape-leader-election-role
subjects:
- kind: ServiceAccount
  name: ecoscape-controller-manager
  namespace: ecoscape-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
