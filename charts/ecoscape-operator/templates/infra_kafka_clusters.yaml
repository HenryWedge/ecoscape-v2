{{- if and .Values.strimzi.enabled .Values.infraKafka.enabled .Values.infraKafka.clusters }}
{{- range $cluster := .Values.infraKafka.clusters }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ $cluster.nodePools.broker.name }}
  namespace: {{ $cluster.namespace }}
  labels:
    {{- include "ecoscape-operator.labels" $ | nindent 4 }}
    strimzi.io/cluster: {{ $cluster.name }}
spec:
  replicas: {{ $cluster.nodePools.broker.replicas }}
  roles:
    - broker
  resources:
    {{- toYaml $cluster.nodePools.broker.resources | nindent 4 }}
  storage:
    type: jbod
    volumes:
      - id: 0
        type: ephemeral
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ $cluster.nodePools.controller.name }}
  namespace: {{ $cluster.namespace }}
  labels:
    {{- include "ecoscape-operator.labels" $ | nindent 4 }}
    strimzi.io/cluster: {{ $cluster.name }}
spec:
  replicas: {{ $cluster.nodePools.controller.replicas }}
  roles:
    - controller
  resources:
    {{- toYaml $cluster.nodePools.controller.resources | nindent 4 }}
  storage:
    type: jbod
    volumes:
      - id: 0
        type: ephemeral
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ $cluster.name }}
  namespace: {{ $cluster.namespace }}
  labels:
    {{- include "ecoscape-operator.labels" $ | nindent 4 }}
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: {{ $cluster.version | quote }}
    metadataVersion: {{ $cluster.metadataVersion | quote }}
    template:
      pod:
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      inter.broker.protocol.version: {{ $cluster.interBrokerProtocolVersion | quote }}
  entityOperator:
    topicOperator:
      resources:
        {{- toYaml $cluster.entityOperator.topicOperator.resources | nindent 8 }}
    userOperator:
      resources:
        {{- toYaml $cluster.entityOperator.userOperator.resources | nindent 8 }}
{{- end }}
{{- end }}
