---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: chaosphases.ecoscape.cau-se.de
spec:
  group: ecoscape.cau-se.de
  names:
    kind: ChaosPhase
    listKind: ChaosPhaseList
    plural: chaosphases
    shortNames:
    - cp
    singular: chaosphase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.topologyRef.name
      name: Topology
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ChaosPhase defines a reusable, named set of faults to inject during an
          experiment's chaos measurement window. It acts as a template: no controller
          reconciles it directly. The experiment controller reads it at runtime and
          materialises temporary Chaos Mesh objects for the duration of the measurement
          window, cleaning them up afterwards.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ChaosPhaseSpec defines the desired fault set for a ChaosPhase.
            properties:
              faults:
                description: Faults to inject during the experiment's chaos measurement
                  window.
                items:
                  description: |-
                    FaultSpec describes a single fault to inject during the chaos phase.
                    Which fields are relevant depends on the Type field.
                  properties:
                    bandwidth:
                      description: Maximum bandwidth on the link (e.g. "10Mbps").
                        Used with NetworkBandwidth.
                      type: string
                    jitter:
                      description: Jitter for latency variance (e.g. "50ms"). Used
                        with NetworkDelay.
                      type: string
                    latency:
                      description: Additional latency to add on the link (e.g. "200ms").
                        Used with NetworkDelay.
                      type: string
                    load:
                      description: CPU load percentage per worker (0–100). Used with
                        CPUStress.
                      format: int32
                      type: integer
                    manifest:
                      description: |-
                        Raw Chaos Mesh manifest in YAML format. Used with Custom.
                        metadata.namespace must be set explicitly in the manifest —
                        no automatic namespace injection is performed.
                      type: string
                    packetLoss:
                      description: |-
                        Packet loss percentage as a plain number string (e.g. "20" for 20%).
                        Used with NetworkLoss.
                      type: string
                    size:
                      description: Memory allocation size per worker (e.g. "256MiB").
                        Used with MemoryStress.
                      type: string
                    type:
                      description: Type of fault to inject.
                      enum:
                      - NetworkDelay
                      - NetworkBandwidth
                      - NetworkLoss
                      - NetworkPartition
                      - CPUStress
                      - MemoryStress
                      - Custom
                      type: string
                    workers:
                      description: |-
                        Number of CPU or memory worker threads.
                        Used with CPUStress and MemoryStress.
                      format: int32
                      type: integer
                    zones:
                      description: |-
                        Zone names from the referenced Topology.
                        For network faults: exactly 2 zones defining the link endpoints.
                        For stress faults: one or more zones; one chaos object is created per zone.
                        Not used for Custom.
                      items:
                        type: string
                      type: array
                  required:
                  - type
                  type: object
                minItems: 1
                type: array
              topologyRef:
                description: |-
                  Reference to the Topology whose zone namespaces are used to resolve
                  zone names to Kubernetes namespaces for all fault types.
                  Required.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            required:
            - faults
            - topologyRef
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
