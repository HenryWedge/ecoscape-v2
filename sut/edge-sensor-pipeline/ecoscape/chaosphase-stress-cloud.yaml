# ChaosPhase — Ressourcen-Stress Munich (thermisches Throttling)
#
# Szenario: Das Munich-IoT-Gerät (Raspberry Pi 3-Klasse) gerät unter thermischen
# Stress — simuliert durch CPU- und Memory-Auslastung.
# Der Munich-Producer schreibt langsamer, der lokale Redis-Stream füllt sich.
#
# Typed faults:
#   - CPUStress:    2 Worker à 80% → simuliert Hintergrundlast / Throttling
#   - MemoryStress: 1 Worker, 128MiB → simuliert Speicherdruck
#
# Custom fault (Escape-Hatch):
#   - DNSChaos: DNS-Auflösung schlägt in Munich fehl — zeigt wie ein nicht-typisierter
#     Chaos-Mesh-Typ eingebunden werden kann. metadata.namespace muss explizit gesetzt sein.
#
# Erwartete Effekte:
#   - Producer-Write-Rate für Munich sinkt (CPU-Throttling)
#   - stream-lag Munich steigt
#   - DNS-Fehler können Verbindungsaufbau verzögern (abhängig vom SUT)
#
# Einsatz: spec.chaosPhaseRef.name: esp-stress-munich
apiVersion: ecoscape.cau-se.de/v1alpha1
kind: ChaosPhase
metadata:
  name: esp-stress-cloud
  namespace: default
spec:
  topologyRef:
    name: two-zone-edge
  faults:
    - type: CPUStress
      zones: [cloud]
      workers: 2
      load: 80