---
# cm-chaos-network-partition.yaml
# Scenario: Zone Berlin goes completely offline (network partition).
# The aggregator can no longer reach the Berlin Redis instance.
# Expected effect: aggregator_stream_lag{zone="berlin"} rises,
#                  aggregator_zone_offline_seconds_total{zone="berlin"} accumulates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-sensor-pipeline-chaos-network-partition
  namespace: default
data:
  01-network-partition-berlin.yaml: |
    apiVersion: chaos-mesh.org/v1alpha1
    kind: NetworkChaos
    metadata:
      name: berlin-partition
      namespace: zone-berlin
    spec:
      action: partition
      mode: all
      selector:
        namespaces:
          - zone-berlin
        labelSelectors:
          app: redis
      direction: both
      duration: "60s"
