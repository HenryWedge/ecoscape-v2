---
# cm-chaos-stress-munich.yaml
# Scenario: Simulates CPU overload on the Munich edge zone (e.g. thermal throttling
# on a Raspberry Pi class device). The producer slows down under CPU pressure.
# Expected effect: producer write rate drops, stream_lag in Munich increases.
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-sensor-pipeline-chaos-stress-munich
  namespace: default
data:
  01-stress-cpu-munich.yaml: |
    apiVersion: chaos-mesh.org/v1alpha1
    kind: StressChaos
    metadata:
      name: munich-cpu-throttle
      namespace: zone-munich
    spec:
      mode: all
      selector:
        namespaces:
          - zone-munich
        labelSelectors:
          app: producer
      stressors:
        cpu:
          workers: 2
          load: 80
      duration: "60s"
