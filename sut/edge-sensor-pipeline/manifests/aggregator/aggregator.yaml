---
apiVersion: v1
kind: Service
metadata:
  name: aggregator
  namespace: aggregator
  labels:
    app: aggregator
spec:
  selector:
    app: aggregator
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  namespace: aggregator
  labels:
    app: aggregator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: aggregator
          image: ecoscape/edge-aggregator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ZONES
              # Format: <name>:<redis-host>[:<port>], comma-separated
              value: "berlin:redis.zone-berlin.svc:6379,munich:redis.zone-munich.svc:6379"
            - name: STREAM_NAME
              value: "sensor-data"
            - name: CONSUMER_GROUP
              value: "aggregator"
            - name: CONSUMER_NAME
              value: "agg-0"
            - name: WINDOW
              value: "60"
            - name: INTERVAL_MS
              value: "500"
            - name: OFFLINE_TIMEOUT_S
              value: "5"
            - name: METRICS_PORT
              value: "8000"
          ports:
            - name: metrics
              containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
