---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: zone-berlin
  labels:
    app: redis
    zone: berlin
spec:
  selector:
    app: redis
    zone: berlin
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: zone-berlin
  labels:
    app: redis
    zone: berlin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      zone: berlin
  template:
    metadata:
      labels:
        app: redis
        zone: berlin
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
