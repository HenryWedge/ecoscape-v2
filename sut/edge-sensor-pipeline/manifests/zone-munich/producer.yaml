---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: zone-munich
  labels:
    app: producer
    zone: munich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
      zone: munich
  template:
    metadata:
      labels:
        app: producer
        zone: munich
    spec:
      containers:
        - name: producer
          image: ecoscape/edge-producer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ZONE
              value: "munich"
            - name: REDIS_HOST
              value: "redis.zone-munich.svc"
            - name: REDIS_PORT
              value: "6379"
            - name: INTERVAL_MS
              value: "500"
            - name: VALUE_BASE
              value: "22.0"
            - name: VALUE_DRIFT
              value: "3.0"
            - name: STREAM_NAME
              value: "sensor-data"
            - name: STREAM_MAXLEN
              value: "10000"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              # Tighter CPU limit to simulate constrained edge hardware
              cpu: "100m"
              memory: "64Mi"
