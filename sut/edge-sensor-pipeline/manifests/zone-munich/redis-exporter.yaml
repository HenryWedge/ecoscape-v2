---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: zone-munich
  labels:
    app: redis-exporter
    zone: munich
spec:
  selector:
    app: redis-exporter
    zone: munich
  ports:
    - name: metrics
      port: 9121
      targetPort: 9121
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: zone-munich
  labels:
    app: redis-exporter
    zone: munich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
      zone: munich
  template:
    metadata:
      labels:
        app: redis-exporter
        zone: munich
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0-alpine
          env:
            - name: REDIS_ADDR
              value: "redis://redis.zone-munich.svc.cluster.local:6379"
            - name: REDIS_EXPORTER_DEBUG
              value: "false"
          ports:
            - containerPort: 9121
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
